# Every scheduled talk lives in this file. The site sorts them by date.
#
# Required: date, speaker, title
# Optional: affiliation, url, time, room, abstract, links, note, cancelled
#
# A note on quoting. Use SINGLE quotes around anything containing TeX:
#   title: 'Bitangents to $\mathcal{C} \subset \mathbb{P}^2$'
# YAML does not process backslash escapes inside single quotes, so \mathbb
# arrives at MathJax intact. Inside double quotes you would have to write
# \\mathbb, which is easy to forget.
#
# For abstracts, ">" folds each paragraph onto one line and keeps blank lines
# as paragraph breaks. Keep the indentation as shown.

- date: 2026-09-08
  speaker: "Thomas Brazelton"
  affiliation: "SLMath MHT / Vanderbilt"
  url: "https://tbrazel.github.io/"
  title: 'An introduction to enumerative geometry and A1-enumerative geometry'
  abstract: >
    We'll provide a leisurely introduction to the basic ideas of enumerative geometry, following its history and development from Ancient Greece to the present day. We will explore Poncelet and Schubert's principle of "conservation of number," and see how it breaks over non-algebraically closed fields. The second half of the talk will explore how methods from motivic homotopy theory can be leveraged to repair conservation of number and provide quadratically enriched answers to classical enumerative questions. This talk will introduce some of the key players in enumerative geometry, including the Grothendieck-Witt ring of a field and quadratic Euler classes.
  # links:
  #   notes: "https://example.edu/notes/noether.pdf"

