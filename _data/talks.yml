- date: 2026-09-09
  speaker: "Sofya Kovalevskaya"
  affiliation: "Stockholm University"
  url: "https://example.edu/~kovalevskaya"
  title: 'Osculating flags and the real Wronski map'
  abstract: >
    The Wronski map $\mathrm{Wr} \colon \mathrm{Gr}(k, n) \to \mathbb{P}^{k(n-k)}$
    is finite and flat of degree equal to the number of standard Young tableaux
    of rectangular shape $k \times (n-k)$. I will discuss what its real fibres
    look like, and why the answer is controlled by a combinatorial object that
    behaves like a domino tiling.
  links:
    slides: "https://example.edu/slides/kovalevskaya.pdf"
    video: "https://example.edu/video/kovalevskaya"
    arxiv: "https://arxiv.org/abs/0000.00000"

