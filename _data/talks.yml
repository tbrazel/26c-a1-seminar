- date: 2026-04-15
  speaker: "Julia Robinson"
  affiliation: "Berkeley"
  title: 'Diophantine definability over rings of integers'
  abstract: >
    An overview of what is known about defining $\ZZ$ inside $\mathcal{O}_K$ by
    a positive existential formula, and what such a definition would say about
    Hilbert's tenth problem for $K$.
  links:
    notes: "https://example.edu/notes/robinson.pdf"

- date: 2026-04-01
  speaker: "Maryam Mirzakhani"
  affiliation: "Stanford"
  title: 'Counting simple closed geodesics'
  abstract: >
    For a hyperbolic surface $X$ of genus $g$, the number of simple closed
    geodesics of length at most $L$ grows like $c_X L^{6g-6}$. I will explain
    where the exponent comes from and what the constant remembers about $X$.

