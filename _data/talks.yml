# Every talk, past and future, lives in this file. The site sorts them by date
# and decides on its own what is upcoming and what belongs in the archive.
#
# Required: date, speaker, title
# Optional: affiliation, url, time, room, abstract, links, note, cancelled
#
# A note on quoting. Use SINGLE quotes around anything containing TeX:
#   title: 'Bitangents to $\mathcal{C} \subset \mathbb{P}^2$'
# YAML does not process backslash escapes inside single quotes, so \mathbb
# arrives at MathJax intact. Inside double quotes you would have to write
# \\mathbb, which is easy to forget.
#
# For abstracts, ">" folds each paragraph onto one line and keeps blank lines
# as paragraph breaks. Keep the indentation as shown.

- date: 2026-09-16
  speaker: "Emmy Noether"
  affiliation: "Göttingen"
  url: "https://example.edu/~noether"
  title: 'Invariant theory and the arithmetic of $\mathbb{Z}/p$-equivariant families'
  abstract: >
    Given a family of varieties carrying an action of a finite group $G$, one
    can ask how the invariants of the family vary and which of them are
    determined by the representation theory of $G$ alone. I will describe a
    filtration on the invariant ring whose graded pieces are governed by the
    fixed loci $X^H$ for $H \le G$, and explain what this gives for families of
    curves of genus $g \ge 2$.

    The second half of the talk concerns an arithmetic application: for
    $G = \mathbb{Z}/p$ the filtration is compatible with reduction mod $\ell$
    for all $\ell \ne p$, which yields a congruence between two counts that were
    previously known to agree only numerically.
  links:
    notes: "https://example.edu/notes/noether.pdf"

- date: 2026-09-23
