# ---------------------------------------------------------------------------
# Edit these four lines and the site is yours.
# ---------------------------------------------------------------------------
title: "A1-Enumerative Geometry Seminar"
description: "A weekly seminar on quadratically enriched enumerative geometry."
url: "https://tbrazel.github.io"   # no trailing slash
baseurl: "/26c-a1-seminar"                 # the repository name, with a leading slash

# Shown in the masthead and on the information page.
seminar:
  meets: "Tuesdays, 11:00 am–12:00 pm"
  room: "Baker Boardroom, SLMath"
  term: "Fall 2026"
  # mailing_list: "https://lists.example.edu/seminar"
  calendar: ""                      # optional .ics or Google Calendar link

organizers:
  - name: "Thomas Brazelton"
    email: "tbraz@alumni.upenn.edu"
    url: "https://tbrazel.github.io/"
  - name: "Kirsten Wickelgren"
    email: "kisten.wickelgren@duke.edu"
    url: "https://sites.math.duke.edu/~kgw/"

# ---------------------------------------------------------------------------
# Build settings — you can leave everything below alone.
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  # null leaves $...$ and $$...$$ untouched so MathJax 3 can handle them.
  # (The default, "mathjax", emits MathJax 2 <script type="math/tex"> tags.)
  math_engine: null
  syntax_highlighter: rouge

timezone: America/New_York

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
